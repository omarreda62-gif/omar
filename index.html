  <script>
    // =========================================================================
    // 1. إعداد الاتصال المباشر بـ Supabase
    // =========================================================================
    const SUPABASE_URL = 'https://nzfwavvqemwpwrlxcgem.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_oCZs-Hj6Kxw5ymCOdToArA_SOB1cTJ5';
    const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const DEFAULT_BOQ_TITLES = [
      'المباني والتعديلات المعمارية',
      'العزل المائي والحراري',
      'تأسيس السباكة والكهرباء والتكييف',
      'المحارة (اللياسة)',
      'النجارة والحلوق',
      'الجبس بورد والأسقف المعلقة',
      'الأرضيات والتكسيات',
      'الدهانات',
      'التركيبات النهائية'
    ];

    const STATUS_LABELS = { new: 'جديد', in_progress: 'قيد التنفيذ', on_hold: 'معلق', completed: 'مكتمل', stopped: 'متوقف' };
    const STAGE_LABELS = { in_beginning: 'في البداية', in_progress: 'جاري التنفيذ', near_delivery: 'قرب التسليم', stalled: 'متعثر', completed: 'مكتمل' };
    const EXPENSE_LABELS = { transportation: 'مواصلات', tips: 'إكراميات', tools: 'أدوات', loading_transport: 'تحميل ونقل', daily_labor: 'عمالة يومية', other: 'مصروفات أخرى' };
    const PAYMENT_LABELS = { cash: 'نقدي', instapay: 'إنستاباي', bank_transfer: 'تحويل بنكي', vodafone_cash: 'فودافون كاش', cheque: 'شيك', other: 'أخرى' };
    const MATERIAL_LABELS = { pending_review: 'قيد المراجعة', approved: 'تم الاعتماد', ordered_from_supplier: 'تم الطلب من المورد', in_transit: 'في الطريق', received: 'تم الاستلام', rejected: 'مرفوض' };
    const TASK_TYPE_LABELS = { inspection: 'معاينة', meeting: 'اجتماع', site_visit: 'زيارة موقع', item_handover: 'استلام بند', supplier: 'موعد مورد', task: 'مهمة' };
    const TASK_STATUS_LABELS = { new: 'جديدة', in_progress: 'جاري العمل', completed: 'مكتملة', overdue: 'متأخرة' };

    const STATE = {
      session: null,
      profile: null,
      tab: 'home',
      selectedProjectId: null,
      projectSubTab: 'items',
      profiles: [],
      projects: [],
      items: [],
      transactions: [],
      payments: [],
      expenses: [],
      workers: [],
      assignments: [],
      evaluations: [],
      reports: [],
      materials: [],
      tasks: [],
      checklists: [],
      files: [],
      notes: []
    };

    const formatEGP = (n) => `${(Number(n) || 0).toLocaleString('ar-EG')} ج.م`;

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const bg = type === 'error' ? 'bg-rose-900 border-rose-700' : 'bg-emerald-800 border-emerald-600';
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl text-xs sm:text-sm font-bold text-white border ${bg}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => el.remove(), 4500);
    }

    function translateError(err, fallback = 'تعذر إتمام العملية حالياً، يرجى التحقق من البيانات والمحاولة مرة أخرى.') {
      const m = String(err?.message || err || '').toLowerCase();
      if (m.includes('invalid login')) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
      if (m.includes('email not confirmed')) return 'يرجى تأكيد البريد الإلكتروني أولاً.';
      if (m.includes('duplicate') || m.includes('unique')) return 'هذا السجل مسجل مسبقاً في النظام.';
      if (m.includes('permission') || m.includes('policy') || m.includes('row-level')) return 'ليس لديك صلاحية لتنفيذ هذا الإجراء.';
      return fallback;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // =========================================================================
    // 2. المصادقة وتحميل البيانات
    // =========================================================================
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!sb) return showToast('تعذر تحميل مكتبة الاتصال بالخادم، أعد تحميل الصفحة.', 'error');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'جاري الدخول...';
      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          showToast(translateError(error), 'error');
          return;
        }
        STATE.session = data.session;
        await initAfterAuth();
        showToast('تم تسجيل الدخول بنجاح، مرحباً بك في مكتب التشطيبات.');
      } catch (err) {
        showToast(translateError(err), 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'دخول إلى مكتب التشطيبات ←';
      }
    });

    async function logoutUser() {
      if (sb) await sb.auth.signOut();
      STATE.session = null;
      STATE.profile = null;
      STATE.selectedProjectId = null;
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('flex');
      document.getElementById('login-screen').classList.remove('hidden');
      showToast('تم تسجيل الخروج بنجاح.');
    }

    async function initAfterAuth() {
      const user = STATE.session?.user;
      if (!user) return;

      const { data: prof } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      if (prof) {
        STATE.profile = prof;
      } else if ((user.email || '').toLowerCase() === 'omarreda62@gmail.com') {
        const adminRow = {
          id: user.id,
          full_name: 'م. عمر رضا',
          email: user.email,
          role: 'admin',
          assigned_project_ids: [],
          can_view_sensitive_finance: true,
          is_active: true
        };
        await sb.from('profiles').upsert(adminRow, { onConflict: 'email' });
        STATE.profile = adminRow;
      }

      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      document.getElementById('app-shell').classList.add('flex');

      const role = getRole();
      document.getElementById('sidebar-user-name').textContent = STATE.profile?.full_name || user.email;
      document.getElementById('sidebar-user-role').textContent =
        role === 'admin' ? 'مدير المكتب' : role === 'engineer' ? 'مهندس موقع' : 'محاسب';

      renderNavigation();
      await refreshAllData();
    }

    function getRole() {
      return STATE.profile?.role || ((STATE.session?.user?.email || '').toLowerCase() === 'omarreda62@gmail.com' ? 'admin' : 'engineer');
    }

    function canViewFinance() {
      const r = getRole();
      return r === 'admin' || r === 'accountant' || Boolean(STATE.profile?.can_view_sensitive_finance);
    }

    function getAllowedProjects() {
      const r = getRole();
      if (r === 'admin' || r === 'accountant') return STATE.projects;
      const ids = Array.isArray(STATE.profile?.assigned_project_ids) ? STATE.profile.assigned_project_ids : [];
      return STATE.projects.filter((p) => ids.includes(p.id));
    }

    async function refreshAllData() {
      if (!sb || !STATE.session) return;
      try {
        const [p1, p2, p3, p4, p5, p6, p7, p8, p9, p10, p11, p12, p13, p14, p15] = await Promise.all([
          sb.from('profiles').select('*').order('created_at', { ascending: false }),
          sb.from('projects').select('*').order('created_at', { ascending: false }),
          sb.from('project_items').select('*').order('sort_order', { ascending: true }),
          sb.from('item_cost_transactions').select('*').order('transaction_date', { ascending: false }),
          sb.from('client_payments').select('*').order('payment_date', { ascending: false }),
          sb.from('general_expenses').select('*').order('expense_date', { ascending: false }),
          sb.from('workers').select('*').order('created_at', { ascending: false }),
          sb.from('worker_assignments').select('*').order('created_at', { ascending: false }),
          sb.from('worker_evaluations').select('*').order('created_at', { ascending: false }),
          sb.from('daily_reports').select('*').order('report_date', { ascending: false }),
          sb.from('material_requests').select('*').order('created_at', { ascending: false }),
          sb.from('appointments_tasks').select('*').order('scheduled_at', { ascending: true }),
          sb.from('quality_checklists').select('*').order('updated_at', { ascending: false }),
          sb.from('project_files').select('*').order('created_at', { ascending: false }),
          sb.from('quick_notes').select('*').order('created_at', { ascending: false })
        ]);

        STATE.profiles = p1.data || [];
        STATE.projects = p2.data || [];
        STATE.items = p3.data || [];
        STATE.transactions = p4.data || [];
        STATE.payments = p5.data || [];
        STATE.expenses = p6.data || [];
        STATE.workers = p7.data || [];
        STATE.assignments = p8.data || [];
        STATE.evaluations = p9.data || [];
        STATE.reports = p10.data || [];
        STATE.materials = p11.data || [];
        STATE.tasks = p12.data || [];
        STATE.checklists = p13.data || [];
        STATE.files = p14.data || [];
        STATE.notes = p15.data || [];

        renderMainView();
      } catch (err) {
        showToast(translateError(err, 'حدث خطأ أثناء تحميل البيانات.'), 'error');
      }
    }

    function computeFinancials(project) {
      const items = STATE.items.filter((i) => i.project_id === project.id);
      const totalItems = items.reduce((s, i) => {
        const t = i.total_cost != null ? Number(i.total_cost) : (Number(i.materials_cost) || 0) + (Number(i.labor_cost) || 0) + (Number(i.staging_cost) || 0);
        return s + t;
      }, 0);
      const avgCompletion = items.length ? Math.round(items.reduce((s, i) => s + (Number(i.completion_percentage) || 0), 0) / items.length) : 0;
      const totalPayments = STATE.payments.filter((p) => p.project_id === project.id).reduce((s, p) => s + (Number(p.amount) || 0), 0);
      const totalExpenses = STATE.expenses.filter((e) => e.project_id === project.id).reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const designCost = (Number(project.design_3d_cost) || 0) + (Number(project.execution_plans_cost) || 0);
      const outflow = totalItems + totalExpenses + designCost;
      const contract = Number(project.contract_value) || 0;
      const hasFixedContract = contract > 0;
      return {
        avgCompletion,
        totalItems,
        totalPayments,
        totalExpenses,
        designCost,
        outflow,
        contract,
        hasFixedContract,
        remainingOnClient: hasFixedContract ? Math.max(0, contract - totalPayments) : Math.max(0, outflow - totalPayments),
        availableBalance: totalPayments - outflow,
        netProfit: hasFixedContract ? contract - outflow : totalPayments - outflow
      };
    }

    // =========================================================================
    // 3. التنقل والقائمة الجانبية
    // =========================================================================
    function getNavItems() {
      const r = getRole();
      return [
        { id: 'home', label: 'الرئيسية', show: true },
        { id: 'operations', label: 'لوحة التشغيل', show: true },
        { id: 'projects', label: 'المشاريع', show: true },
        { id: 'workers', label: 'العمال والصنايعية', show: r !== 'accountant' },
        { id: 'accounts', label: 'حسابات المشروع', show: true },
        { id: 'payments', label: 'دفعات العميل', show: canViewFinance() },
        { id: 'appointments', label: 'المواعيد', show: true },
        { id: 'materials', label: 'الموردون والخامات', show: true },
        { id: 'team', label: 'إدارة الفريق', show: r === 'admin' },
        { id: 'settings', label: 'الإعدادات والأدوات', show: true }
      ].filter((x) => x.show);
    }

    function renderNavigation() {
      const items = getNavItems();
      const html = items
        .map(
          (it) => `
          <button onclick="switchTab('${it.id}')"
            class="w-full text-right px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all cursor-pointer ${
              STATE.tab === it.id ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
            }">
            ${it.label}
          </button>`
        )
        .join('');
      document.getElementById('desktop-nav').innerHTML = html;
      document.getElementById('mobile-nav').innerHTML = html;
    }

    function toggleMobileMenu(open) {
      const el = document.getElementById('mobile-drawer');
      if (open) el.classList.remove('hidden');
      else el.classList.add('hidden');
    }

    function switchTab(tabId) {
      STATE.tab = tabId;
      if (tabId !== 'projects') STATE.selectedProjectId = null;
      toggleMobileMenu(false);
      renderNavigation();
      renderMainView();
    }

    function openProject(projectId) {
      STATE.tab = 'projects';
      STATE.selectedProjectId = projectId;
      renderNavigation();
      renderMainView();
    }

    // =========================================================================
    // 4. عرض الصفحات (الرئيسية، التشغيل، المشاريع، الحسابات، الدفعات، إلخ)
    // =========================================================================
    function renderMainView() {
      const navItem = getNavItems().find((n) => n.id === STATE.tab);
      const selectedProj = STATE.projects.find((p) => p.id === STATE.selectedProjectId);
      document.getElementById('header-title').textContent = selectedProj ? selectedProj.name : navItem?.label || 'مكتب التشطيبات';

      const container = document.getElementById('main-content');
      if (STATE.tab === 'home') container.innerHTML = renderHomeView();
      else if (STATE.tab === 'operations') container.innerHTML = renderOperationsView();
      else if (STATE.tab === 'projects' && !selectedProj) container.innerHTML = renderProjectsListView();
      else if (STATE.tab === 'projects' && selectedProj) container.innerHTML = renderProjectDetailView(selectedProj);
      else if (STATE.tab === 'workers') container.innerHTML = renderWorkersView();
      else if (STATE.tab === 'accounts') container.innerHTML = renderAccountsView();
      else if (STATE.tab === 'payments') container.innerHTML = renderPaymentsView();
      else if (STATE.tab === 'appointments') container.innerHTML = renderAppointmentsView();
      else if (STATE.tab === 'materials') container.innerHTML = renderMaterialsView();
      else if (STATE.tab === 'team') container.innerHTML = renderTeamView();
      else if (STATE.tab === 'settings') container.innerHTML = renderSettingsView();
    }

    function renderHomeView() {
      const projs = getAllowedProjects();
      let contracts = 0, collected = 0, outflow = 0, netBalance = 0;
      projs.forEach((p) => {
        const f = computeFinancials(p);
        contracts += f.contract;
        collected += f.totalPayments;

    async function submitNewProject(e) {
      e.preventDefault();
      try {
        const payload = {
          name: document.getElementById('np-name').value.trim(),
          client_name: document.getElementById('np-client').value.trim(),
          client_phone: document.getElementById('np-phone').value.trim(),
          address: document.getElementById('np-address').value.trim(),
          contract_value: Number(document.getElementById('np-contract')?.value) || 0,
          status: document.getElementById('np-status').value,
          visual_stage: 'in_beginning',
          start_date: document.getElementById('np-start').value,
          delivery_date: document.getElementById('np-delivery').value,
          design_3d_cost: Number(document.getElementById('np-3d').value) || 0,
          execution_plans_cost: Number(document.getElementById('np-plans').value) || 0,
          notes: document.getElementById('np-notes').value.trim(),
          created_by: STATE.session?.user?.id || null
        };
        const { error } = await sb.from('projects').insert(payload);
        if (error) throw error;
        closeModal();
        await refreshAllData();
        showToast('تم إنشاء المشروع وتوليد البنود الـ 9 الأساسية بنجاح.');
      } catch (err) {
        showToast(translateError(err, 'تعذر حفظ المشروع.'), 'error');

          project_id: projectId,
          item_id: itemId,

    async function submitDailyReport(e, projectId) {
      e.preventDefault();
      try {
        const file = document.getElementById('rep-photo').files?.[0];
        const photos = [];
        if (file) {
          const path = `${projectId}/reports/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
          const { error: upErr } = await sb.storage.from('project-files').upload(path, file);
          if (!upErr) {
            const { data: pub } = sb.storage.from('project-files').getPublicUrl(path);
            if (pub?.publicUrl) photos.push(pub.publicUrl);
          }
        }
        const { error } = await sb.from('daily_reports').insert({
          project_id: projectId,
          report_date: document.getElementById('rep-date').value,
          workers_count: Number(document.getElementById('rep-workers').value) || 0,
          work_done: document.getElementById('rep-work').value.trim(),
          obstacles: document.getElementById('rep-obs').value.trim(),
          office_requests: document.getElementById('rep-req').value.trim(),
          photos,
          created_by: STATE.session?.user?.id || null
        });
        if (error) throw error;
        await refreshAllData();
        showToast('تم حفظ تقرير الموقع اليومي.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    async function uploadProjectFile(e, projectId) {
      e.preventDefault();
      const file = document.getElementById('pf-file').files?.[0];
      if (!file) return;
      try {
        const cat = document.getElementById('pf-cat').value;
        const path = `${projectId}/${cat}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
        const { error: upErr } = await sb.storage.from('project-files').upload(path, file);
        if (upErr) throw upErr;
        const { data: pub } = sb.storage.from('project-files').getPublicUrl(path);
        const { error } = await sb.from('project_files').insert({
          project_id: projectId,
          category: cat,
          file_name: file.name,
          file_url: pub?.publicUrl || path,
          uploaded_by: STATE.session?.user?.id || null
        });
        if (error) throw error;
        await refreshAllData();
        showToast('تم رفع الملف بنجاح.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <form onsubmit="submitNewTask(event)" class="bg-white p-5 rounded-2xl border border-slate-200 space-y-3 text-xs h-fit">
            <h3 class="font-extrabold text-sm">إضافة موعد / مهمة</h3>
            <input id="tk-title" required placeholder="العنوان *" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300" />
            <select id="tk-type" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold bg-white">
              ${Object.entries(TASK_TYPE_LABELS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}
            </select>
            <input id="tk-date" type="datetime-local" required value="${new Date().toISOString().slice(0, 16)}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300" />
            <select id="tk-proj" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold bg-white">
              <option value="">عام</option>
              ${projs.map((p) => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
            </select>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold cursor-pointer">حفظ</button>
          </form>
          <div class="lg:col-span-2 space-y-3">
            ${STATE.tasks
              .map(
                (t) => `
              <div class="bg-white p-4 rounded-2xl border border-slate-200 flex justify-between items-center text-xs">
                <div>
                  <span class="px-2 py-0.5 rounded bg-slate-900 text-white font-bold">${TASK_TYPE_LABELS[t.entry_type] || t.entry_type}</span>
                  <h4 class="font-extrabold text-sm mt-1">${escapeHtml(t.title)}</h4>
                  <p class="text-slate-500">${new Date(t.scheduled_at).toLocaleString('ar-EG')}</p>
                </div>
                <select onchange="updateTaskStatus('${t.id}', this.value)" class="px-3 py-1.5 rounded-xl border border-slate-200 font-bold bg-slate-50">
                  ${Object.entries(TASK_STATUS_LABELS).map(([k, v]) => `<option value="${k}" ${t.status === k ? 'selected' : ''}>${v}</option>`).join('')}
                </select>
              </div>`
              )
              .join('')}
          </div>
        </div>`;
    }

    async function submitNewTask(e) {
      e.preventDefault();
      try {
        const { error } = await sb.from('appointments_tasks').insert({
          title: document.getElementById('tk-title').value.trim(),
          entry_type: document.getElementById('tk-type').value,
          scheduled_at: new Date(document.getElementById('tk-date').value).toISOString(),
          project_id: document.getElementById('tk-proj').value || null,
          status: 'new',
          created_by: STATE.session?.user?.id || null
        });
        if (error) throw error;
        await refreshAllData();
        showToast('تم حفظ الموعد بنجاح.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    async function updateTaskStatus(id, status) {
      await sb.from('appointments_tasks').update({ status }).eq('id', id);
      await refreshAllData();
      showToast('تم تحديث الحالة.');
    }

    function renderMaterialsView() {
      const projs = getAllowedProjects();
      const isAdmin = getRole() === 'admin';
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <form onsubmit="submitMaterialReq(event)" class="bg-white p-5 rounded-2xl border border-slate-200 space-y-3 text-xs h-fit">
            <h3 class="font-extrabold text-sm">طلب خامة جديدة</h3>
            <select id="mr-proj" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold bg-white">
              ${projs.map((p) => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
            </select>
            <input id="mr-name" required placeholder="اسم الخامة *" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300" />
            <div class="grid grid-cols-2 gap-2">
              <input id="mr-qty" type="number" min="1" required placeholder="الكمية *" class="w-full px-3 py-2 rounded-xl border border-slate-300" />
              <input id="mr-unit" value="شيكارة" placeholder="الوحدة" class="w-full px-3 py-2 rounded-xl border border-slate-300" />
            </div>
            <input id="mr-date" type="date" value="${new Date().toISOString().slice(0, 10)}" class="w-full px-3.5 py-2 rounded-xl border border-slate-300" />
            <input id="mr-notes" placeholder="ملاحظات" class="w-full px-3.5 py-2 rounded-xl border border-slate-300" />
            <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold cursor-pointer">إرسال الطلب</button>
          </form>

          <div class="lg:col-span-2 space-y-3">
            ${STATE.materials
              .map(
                (m) => `
              <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-2 text-xs">
                <div class="flex justify-between items-center">
                  <h4 class="font-extrabold text-sm">${escapeHtml(m.material_name)} (${m.quantity} ${escapeHtml(m.unit)})</h4>
                  <span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-900 font-extrabold">${MATERIAL_LABELS[m.status] || m.status}</span>
                </div>
                <p class="text-slate-500">${escapeHtml(STATE.projects.find((p) => p.id === m.project_id)?.name || '')} • احتياج: ${m.needed_date}</p>
                <div class="flex gap-2 pt-1">
                  ${isAdmin && m.status === 'pending_review' ? `<button onclick="updateMaterialStatus('${m.id}', 'approved')" class="px-3 py-1 rounded-lg bg-emerald-600 text-white font-bold cursor-pointer">اعتماد</button><button onclick="updateMaterialStatus('${m.id}', 'rejected')" class="px-3 py-1 rounded-lg bg-rose-600 text-white font-bold cursor-pointer">رفض</button>` : ''}
                  ${m.status === 'approved' || m.status === 'in_transit' ? `<button onclick="updateMaterialStatus('${m.id}', 'received')" class="px-3 py-1 rounded-lg bg-slate-900 text-white font-bold cursor-pointer">تم الاستلام</button>` : ''}
                </div>
              </div>`
              )
              .join('')}
          </div>
        </div>`;
    }

    async function submitMaterialReq(e) {
      e.preventDefault();
      try {
        const { error } = await sb.from('material_requests').insert({
          project_id: document.getElementById('mr-proj').value,
          material_name: document.getElementById('mr-name').value.trim(),
          quantity: Number(document.getElementById('mr-qty').value) || 1,
          unit: document.getElementById('mr-unit').value.trim() || 'وحدة',
          needed_date: document.getElementById('mr-date').value,
          engineer_notes: document.getElementById('mr-notes').value.trim(),
          status: 'pending_review',
          created_by: STATE.session?.user?.id || null
        });
        if (error) throw error;
        await refreshAllData();
        showToast('تم إرسال طلب الخامة للمراجعة.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    async function updateMaterialStatus(id, status) {
      await sb.from('material_requests').update({ status }).eq('id', id);
      await refreshAllData();
      showToast('تم تحديث حالة الطلب.');
    }

    function renderTeamView() {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <form onsubmit="submitTeamMember(event)" class="bg-white p-5 rounded-2xl border border-slate-200 space-y-3 text-xs h-fit">
            <h3 class="font-extrabold text-sm">إضافة / تحديث موظف</h3>
            <input id="tm-name" required placeholder="الاسم الكامل *" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300" />
            <input id="tm-email" type="email" required dir="ltr" placeholder="employee@email.com *" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-left" />
            <select id="tm-role" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold bg-white">
              <option value="engineer">مهندس موقع</option>
              <option value="accountant">محاسب</option>
            </select>
            <label class="flex items-center gap-2 font-bold">
              <input id="tm-fin" type="checkbox" />
              <span>السماح برؤية قيمة العقود والأرباح</span>
            </label>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold cursor-pointer">حفظ الصلاحيات</button>
          </form>

          <div class="lg:col-span-2 space-y-3">
            ${STATE.profiles
              .map(
                (u) => `
              <div class="bg-white p-4 rounded-2xl border border-slate-200 text-xs">
                <h4 class="font-extrabold text-sm">${escapeHtml(u.full_name)}</h4>
                <p class="text-slate-500" dir="ltr">${escapeHtml(u.email)}</p>
                <p class="mt-1">الدور: <strong>${u.role}</strong> • العقود والأرباح: <strong>${u.can_view_sensitive_finance ? 'مسموح' : 'مخفي'}</strong></p>
              </div>`
              )
              .join('')}
          </div>
        </div>`;
    }

    async function submitTeamMember(e) {
      e.preventDefault();
      const email = document.getElementById('tm-email').value.trim().toLowerCase();
      const full_name = document.getElementById('tm-name').value.trim();
      const role = document.getElementById('tm-role').value;
      const can_view_sensitive_finance = role === 'accountant' ? true : document.getElementById('tm-fin').checked;
      try {
        const existing = STATE.profiles.find((p) => p.email.toLowerCase() === email);
        if (existing) {
          await sb.from('profiles').update({ full_name, role, can_view_sensitive_finance }).eq('id', existing.id);
        } else {
          await sb.from('profiles').insert({
            id: crypto.randomUUID(),
            full_name,
            email,
            role,
            can_view_sensitive_finance,
            is_active: true
          });
        }
        await refreshAllData();
        showToast('تم حفظ بيانات الموظف وصلاحياته.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    function renderSettingsView() {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-3 text-xs">
            <h3 class="font-extrabold text-sm">حاسبة كميات التشطيبات</h3>
            <select id="calc-kind" onchange="updateCalc()" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold bg-white">
              <option value="ceramic">سيراميك</option>
              <option value="porcelain">بورسلين</option>
              <option value="paint">دهانات</option>
              <option value="plaster">محارة</option>
              <option value="gypsum">جبس بورد</option>
            </select>
            <div class="grid grid-cols-2 gap-2">
              <input id="calc-area" type="number" value="120" oninput="updateCalc()" placeholder="المساحة م²" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />
              <input id="calc-waste" type="number" value="10" oninput="updateCalc()" placeholder="نسبة الهالك %" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />
            </div>
            <div id="calc-res" class="p-4 rounded-2xl bg-emerald-900 text-white font-extrabold text-sm">132.0 م² خامات (شاملة الهالك 10%)</div>
          </div>

          <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-3 text-xs">
            <h3 class="font-extrabold text-sm">المفكرة السريعة (Scratchpad)</h3>
            <form onsubmit="submitQuickNote(event)" class="flex gap-2">
              <input id="qn-text" required placeholder="سجّل ملاحظة سريعة أو رقم..." class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-300" />
              <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-extrabold cursor-pointer">حفظ</button>
            </form>
            <div class="space-y-2 max-h-56 overflow-y-auto">
              ${STATE.notes
                .map(
                  (n) => `
                <div class="p-3 rounded-xl bg-amber-50/70 border border-amber-200 font-bold text-slate-900">
                  ${escapeHtml(n.content)}
                </div>`
                )
                .join('')}
            </div>
          </div>
        </div>`;
    }

    function updateCalc() {
      const k = document.getElementById('calc-kind')?.value || 'ceramic';
      const area = Number(document.getElementById('calc-area')?.value) || 0;
      const waste = Number(document.getElementById('calc-waste')?.value) || 0;
      const base = area * (1 + waste / 100);
      let txt = `${base.toFixed(1)} م² خامات (شاملة الهالك ${waste}%)`;
      if (k === 'paint') txt = `${Math.max(1, Math.ceil(base / 10))} بستلة دهان تقريباً`;
      if (k === 'plaster') txt = `${Math.max(1, Math.ceil(base * 0.22))} شيكارة أسمنت تقريباً`;
      if (k === 'gypsum') txt = `${Math.max(1, Math.ceil(base / 2.88))} لوح جبس بورد تقريباً`;
      const el = document.getElementById('calc-res');
      if (el) el.textContent = txt;
    }

    async function submitQuickNote(e) {
      e.preventDefault();
      const content = document.getElementById('qn-text').value.trim();
      if (!content) return;
      try {
        const { error } = await sb.from('quick_notes').insert({
          user_id: STATE.session?.user?.id,
          content
        });
        if (error) throw error;
        await refreshAllData();
        showToast('تم حفظ الملاحظة.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    // فحص الجلسة الحالية عند فتح الصفحة
    window.addEventListener('DOMContentLoaded', async () => {
      if (!sb) return;
      try {
        const { data } = await sb.auth.getSession();
        if (data?.session) {
          STATE.session = data.session;
          await initAfterAuth();
        }
      } catch (_) {}
    });
  </script>
</body>
</html>
