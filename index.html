    const STATE = {
      session: null,

    const OFFICE_PCT_STORAGE_KEY = 'tashtibat_office_pct_map_v1';
    const OFFICE_WITHDRAWALS_STORAGE_KEY = 'tashtibat_office_withdrawals_v1';
    const TASK_REMINDER_STORAGE_KEY = 'tashtibat_task_reminders_v1';
    const NOTIFIED_TASKS_SESSION_KEY = 'tashtibat_notified_tasks_v1';

    function getLocalOfficePctMap() {
      try {
        return JSON.parse(localStorage.getItem(OFFICE_PCT_STORAGE_KEY) || '{}');
      } catch (_) {
        return {};
      }
    }

    function setLocalOfficePct(projectId, pct) {
      try {
        const map = getLocalOfficePctMap();
        map[projectId] = Number(pct) || 15;
        localStorage.setItem(OFFICE_PCT_STORAGE_KEY, JSON.stringify(map));
      } catch (_) {}
    }

    function getProjectOfficePct(project) {
      if (!project) return 15;
      if (project.office_percentage !== undefined && project.office_percentage !== null) {
        return Number(project.office_percentage);
      }
      const map = getLocalOfficePctMap();
      return map[project.id] !== undefined ? Number(map[project.id]) : 15;
    }

    function getLocalWithdrawals() {
      try {
        return JSON.parse(localStorage.getItem(OFFICE_WITHDRAWALS_STORAGE_KEY) || '[]');
      } catch (_) {
        return [];
      }
    }

    function saveLocalWithdrawal(row) {
      try {
        const list = getLocalWithdrawals();
        list.unshift(row);
        localStorage.setItem(OFFICE_WITHDRAWALS_STORAGE_KEY, JSON.stringify(list));
      } catch (_) {}
    }

    function formatEGP(val) {
      return `${(Number(val) || 0).toLocaleString('ar-EG')} ج.م`;
    }

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl text-xs font-extrabold text-center border transition-all ${
        type === 'error'
          ? 'bg-rose-800 text-white border-rose-900'
          : 'bg-[#2D1B14] text-[#FAF6F2] border-[#A85438]'
      }`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => el.remove(), 4200);
    }

    function translateError(err, fallback = 'تعذر إتمام العملية حالياً، يرجى المحاولة مرة أخرى.') {
      const raw = String(err?.message || err?.details || err || '').toLowerCase();
      if (!raw) return fallback;
      if (raw.includes('invalid login') || raw.includes('credentials')) {
        return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
      }
      if (raw.includes('email not confirmed')) {
        return 'يرجى تأكيد البريد الإلكتروني أولاً أو إغلاق Confirm Email في Supabase.';
      }
      if (raw.includes('permission') || raw.includes('policy') || raw.includes('rls')) {
        return 'يرجى تفعيل صلاحية الإضافة من Supabase SQL Editor.';
      }
      if (raw.includes('duplicate') || raw.includes('unique') || raw.includes('already registered')) {
        return 'هذا البريد الإلكتروني أو السجل مسجل بالفعل في النظام.';
      }
      return fallback;
    }

    function isMainAdmin() {
      const email = (STATE.session?.user?.email || '').toLowerCase();
      return email === ADMIN_EMAIL || STATE.profile?.role === 'admin';
    }

    function canSeeFinance() {
      return isMainAdmin() || STATE.profile?.role === 'accountant' || Boolean(STATE.profile?.can_view_sensitive_finance);
    }

    function getAllowedProjects() {
      if (isMainAdmin() || STATE.profile?.role === 'accountant') return STATE.projects;
      const ids = Array.isArray(STATE.profile?.assigned_project_ids) ? STATE.profile.assigned_project_ids : [];
      return STATE.projects.filter((p) => ids.includes(p.id));
    }

    function computeFinancials(project) {
      const pItems = STATE.items.filter((i) => i.project_id === project.id);
      const itemsCost = pItems.reduce((sum, it) => {
        const t = it.total_cost !== undefined && it.total_cost !== null
          ? Number(it.total_cost)
          : (Number(it.materials_cost) || 0) + (Number(it.labor_cost) || 0) + (Number(it.staging_cost) || 0);
        return sum + t;
      }, 0);
      const progress = pItems.length
        ? Math.round(pItems.reduce((s, it) => s + (Number(it.completion_percentage) || 0), 0) / pItems.length)
        : Number(project.completion_percentage) || 0;
      const paymentsTotal = STATE.payments
        .filter((p) => p.project_id === project.id)
        .reduce((s, p) => s + (Number(p.amount) || 0), 0);
      const expensesTotal = STATE.expenses
        .filter((e) => e.project_id === project.id)
        .reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const designCost = (Number(project.design_3d_cost) || 0) + (Number(project.execution_plans_cost) || 0);
      const totalSpent = itemsCost + expensesTotal + designCost;
      const contract = Number(project.contract_value) || 0;

      const officePct = getProjectOfficePct(project);
      const officeEarned = Math.round((totalSpent * officePct) / 100);
      const officeWithdrawn = STATE.officeWithdrawals
        .filter((w) => w.project_id === project.id)
        .reduce((s, w) => s + (Number(w.amount) || 0), 0);
      const officeRemaining = officeEarned - officeWithdrawn;
      const balanceBeforeOffice = paymentsTotal - totalSpent;
      const balance = balanceBeforeOffice - officeWithdrawn;

      return {
        itemsCost,
        progress,
        paymentsTotal,
        expensesTotal,
        designCost,
        totalSpent,
        contract,
        remainingOnClient: Math.max(0, contract - paymentsTotal),
        balanceBeforeOffice,
        balance,
        profit: contract - totalSpent,
        officePct,
        officeEarned,
        officeWithdrawn,
        officeRemaining
      };
    }
