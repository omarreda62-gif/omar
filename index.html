    function getLocalOfficePctMap() {
      try {
        return JSON.parse(localStorage.getItem(OFFICE_PCT_STORAGE_KEY) || '{}');
      } catch (_) {
        return {};
      }
    }

    function setLocalOfficePct(projectId, pct) {
      try {
        const map = getLocalOfficePctMap();
        map[projectId] = Number(pct) || 15;
        localStorage.setItem(OFFICE_PCT_STORAGE_KEY, JSON.stringify(map));
      } catch (_) {}
    }

    function getProjectOfficePct(project) {
      if (!project) return 15;
      if (project.office_percentage !== undefined && project.office_percentage !== null) {
        return Number(project.office_percentage);
      }
      const map = getLocalOfficePctMap();
      return map[project.id] !== undefined ? Number(map[project.id]) : 15;
    }

    function getLocalWithdrawals() {

    function translateError(err, fallback = 'تعذر إتمام العملية حالياً، يرجى المحاولة مرة أخرى.') {
      const raw = String(err?.message || err?.details || err || '').toLowerCase();
      if (!raw) return fallback;
      if (raw.includes('invalid login') || raw.includes('credentials')) {
        return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
      }
      if (raw.includes('email not confirmed')) {
        return 'يرجى تأكيد البريد الإلكتروني أولاً أو إغلاق Confirm Email في Supabase.';
      }
      if (raw.includes('permission') || raw.includes('policy') || raw.includes('rls')) {
        return 'يرجى تفعيل صلاحية الإضافة من Supabase SQL Editor.';
      }
      if (raw.includes('duplicate') || raw.includes('unique') || raw.includes('already registered')) {
        return 'هذا البريد الإلكتروني أو السجل مسجل بالفعل في النظام.';
      }
      return fallback;
    }

    function isMainAdmin() {
      const email = (STATE.session?.user?.email || '').toLowerCase();
      return email === ADMIN_EMAIL || STATE.profile?.role === 'admin';
    }

    function canSeeFinance() {
      return isMainAdmin() || STATE.profile?.role === 'accountant' || Boolean(STATE.profile?.can_view_sensitive_finance);

    function getAllowedProjects() {
      if (isMainAdmin() || STATE.profile?.role === 'accountant') return STATE.projects;
      const ids = Array.isArray(STATE.profile?.assigned_project_ids) ? STATE.profile.assigned_project_ids : [];
      return STATE.projects.filter((p) => ids.includes(p.id));
    }

    function computeFinancials(project) {
      const pItems = STATE.items.filter((i) => i.project_id === project.id);
      const itemsCost = pItems.reduce((sum, it) => {
        const t = it.total_cost !== undefined && it.total_cost !== null
          ? Number(it.total_cost)
          : (Number(it.materials_cost) || 0) + (Number(it.labor_cost) || 0) + (Number(it.staging_cost) || 0);
        return sum + t;
      }, 0);
      const progress = pItems.length
        ? Math.round(pItems.reduce((s, it) => s + (Number(it.completion_percentage) || 0), 0) / pItems.length)
        : Number(project.completion_percentage) || 0;
      const paymentsTotal = STATE.payments
        .filter((p) => p.project_id === project.id)
        .reduce((s, p) => s + (Number(p.amount) || 0), 0);
      const expensesTotal = STATE.expenses
        .filter((e) => e.project_id === project.id)
        .reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const designCost = (Number(project.design_3d_cost) || 0) + (Number(project.execution_plans_cost) || 0);
      const totalSpent = itemsCost + expensesTotal + designCost;
      const contract = Number(project.contract_value) || 0;
      const balance = paymentsTotal - totalSpent;

      const officePct = getProjectOfficePct(project);
      const officeEarned = Math.round((totalSpent * officePct) / 100);
      const officeWithdrawn = STATE.officeWithdrawals
        .filter((w) => w.project_id === project.id)
        .reduce((s, w) => s + (Number(w.amount) || 0), 0);
      const officeRemaining = officeEarned - officeWithdrawn;

      return {
        itemsCost,
        expensesTotal,
        designCost,
        totalSpent,
        paymentsTotal,
        contract,
        balance,
        progress,
        officePct,
        officeEarned,
        officeWithdrawn,
        officeRemaining
      };
    }

    async function uploadProjectFile(file, projectId, folder = 'general') {
      if (!sb || !file) return null;
      const safeName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
      const path = `${projectId || 'office'}/${folder}/${safeName}`;
      const { error } = await sb.storage.from('project-files').upload(path, file, { upsert: false });
      if (error) {
        throw new Error('تعذر رفع الملف إلى مجلد المشروع، تأكد من وجود Bucket باسم project-files.');
      }
      const { data } = sb.storage.from('project-files').getPublicUrl(path);
      return data?.publicUrl || path;
    }

        showToast('تعذر تحميل مكتبة الاتصال، أعد تحميل الصفحة.', 'error');
        return;
      }
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.querySelector('span').textContent = 'جاري الدخول...';
      try {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          showToast(translateError(error), 'error');
          return;
        }
        STATE.session = data.session;
        await initAfterAuth();
        showToast('مرحباً بك في مكتب التشطيبات');
      } catch (err) {
        showToast(translateError(err), 'error');
      } finally {
        btn.disabled = false;
        btn.querySelector('span').textContent = 'ابدأ العمل الآن';
      }
    });

    async function logoutUser() {
      if (sb) await sb.auth.signOut();
      STATE.session = null;
      STATE.profile = null;
      STATE.selectedProjectId = null;
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('flex');
      document.getElementById('boot-screen')?.classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      showToast('تم تسجيل الخروج بنجاح.');
    }

    async function initAfterAuth() {
      const user = STATE.session?.user;
      if (!user) return;
      document.getElementById('boot-screen')?.classList.add('hidden');
      document.getElementById('login-screen').classList.add('hidden');
      const appShell = document.getElementById('app-shell');
      appShell.classList.remove('hidden');
      appShell.classList.add('flex');

      const { data: prof } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      if (prof) {
        STATE.profile = prof;
      } else if ((user.email || '').toLowerCase() === ADMIN_EMAIL) {
        STATE.profile = {
          id: user.id,
          full_name: 'م. عمر رضا',
          email: user.email,
          role: 'admin',
          can_view_sensitive_finance: true,
          assigned_project_ids: [],
          is_active: true
        };
        await sb.from('profiles').upsert(STATE.profile, { onConflict: 'email' });
      } else {
        const { data: profByEmail } = await sb
          .from('profiles')
          .select('*')
          .eq('email', (user.email || '').toLowerCase())
          .maybeSingle();
        if (profByEmail) {
          STATE.profile = profByEmail;
        }
      }

      if (STATE.profile && STATE.profile.is_active === false) {
        showToast('تم إيقاف حسابك مؤقتاً، يرجى مراجعة مدير المكتب.', 'error');
        await logoutUser();
        return;
      }

      const displayName = STATE.profile?.full_name || user.email;
      document.getElementById('sidebar-user-name').textContent = displayName;
      document.getElementById('sidebar-avatar').textContent = displayName.charAt(0);
      document.getElementById('mobile-avatar').textContent = displayName.charAt(0);
      document.getElementById('sidebar-user-role').textContent =
        isMainAdmin() ? 'مدير المكتب' : STATE.profile?.role === 'accountant' ? 'محاسب' : 'مهندس موقع';

      renderNavigation();
      await refreshAllData();
    }

    async function refreshAllData() {
      if (!sb || !STATE.session) return;
      const [
        profRes,
        projRes,
        itemsRes,
        txRes,
        payRes,
        expRes,
        withRes,
        workRes,
        assignRes,
        evalRes,
        repRes,
        matRes,
        taskRes,
        chkRes,
        fileRes,
        noteRes
      ] = await Promise.all([
        sb.from('profiles').select('*').order('created_at', { ascending: false }),
        sb.from('projects').select('*').order('created_at', { ascending: false }),
        sb.from('project_items').select('*').order('sort_order', { ascending: true }),
        sb.from('item_cost_transactions').select('*').order('transaction_date', { ascending: false }),
        sb.from('client_payments').select('*').order('payment_date', { ascending: false }),
        sb.from('general_expenses').select('*').order('expense_date', { ascending: false }),
        sb.from('office_withdrawals').select('*').order('withdrawal_date', { ascending: false }),
        sb.from('workers').select('*').order('created_at', { ascending: false }),
        sb.from('worker_assignments').select('*').order('created_at', { ascending: false }),
        sb.from('worker_evaluations').select('*').order('created_at', { ascending: false }),
        sb.from('daily_reports').select('*').order('report_date', { ascending: false }),
        sb.from('material_requests').select('*').order('created_at', { ascending: false }),
        sb.from('appointments_tasks').select('*').order('scheduled_at', { ascending: true }),
        sb.from('quality_checklists').select('*').order('updated_at', { ascending: false }),
        sb.from('project_files').select('*').order('created_at', { ascending: false }),
        sb.from('quick_notes').select('*').order('created_at', { ascending: false })
      ]);

      STATE.profiles = profRes.data || [];
      STATE.projects = projRes.data || [];
      STATE.items = itemsRes.data || [];
      STATE.transactions = txRes.data || [];
      STATE.payments = payRes.data || [];
      STATE.expenses = expRes.data || [];
      STATE.officeWithdrawals = !withRes.error && withRes.data ? withRes.data : getLocalWithdrawals();
      STATE.workers = workRes.data || [];
      STATE.assignments = assignRes.data || [];
      STATE.evaluations = evalRes.data || [];
      STATE.reports = repRes.data || [];
      STATE.materials = matRes.data || [];
      STATE.tasks = taskRes.data || [];
      STATE.checklists = chkRes.data || [];
      STATE.files = fileRes.data || [];
      STATE.notes = noteRes.data || [];

      renderCurrentView();
    }

    function renderNavigation() {
      const items = getNavItems();
      const desktopNav = document.getElementById('desktop-nav');
      const mobileNav = document.getElementById('mobile-bottom-nav');

      desktopNav.innerHTML = items
        .map(
          (it) => `
          <button onclick="switchTab('${it.id}')"
            class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-extrabold transition-all cursor-pointer ${
              STATE.activeTab === it.id
                ? 'bg-[#C6A984] text-[#14110E] shadow-lg shadow-[#C6A984]/20'
                : 'text-[#B5A99D] hover:bg-[#241E19] hover:text-white'
            }">
            <span class="w-6 h-6 rounded-lg flex items-center justify-center ${
              STATE.activeTab === it.id ? 'bg-[#14110E]/15' : 'bg-[#26201A]'
            }">${it.icon}</span>
            <span>${it.label}</span>
          </button>`
        )
        .join('');

      mobileNav.innerHTML = items
        .map(
          (it) => `
          <button onclick="switchTab('${it.id}')"
            class="flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-extrabold whitespace-nowrap transition-all cursor-pointer ${
              STATE.activeTab === it.id ? 'bg-[#C6A984] text-[#14110E]' : 'text-[#A39689] hover:text-white'
            }">
            <span>${it.icon}</span>
            ${STATE.activeTab === it.id ? `<span>${it.label}</span>` : ''}
          </button>`
        )
        .join('');
    }

    function switchTab(tabId) {
      STATE.activeTab = tabId;
      STATE.selectedProjectId = null;
      renderNavigation();
      renderCurrentView();
    }

    function openProject(projectId, subTab = 'items') {
      STATE.activeTab = 'projects';
      STATE.selectedProjectId = projectId;
      STATE.projectSubTab = subTab;
      renderNavigation();
      renderCurrentView();
    }

    function renderCurrentView() {
      const titleEl = document.getElementById('page-title');
      const main = document.getElementById('main-content');
      const allowed = getAllowedProjects();

      if (STATE.activeTab === 'home') {
        titleEl.textContent = 'الرئيسية';
        main.innerHTML = renderHomeView(allowed);
      } else if (STATE.activeTab === 'projects') {
        if (STATE.selectedProjectId) {
          const proj = allowed.find((p) => p.id === STATE.selectedProjectId);
          if (proj) {
            titleEl.textContent = proj.name;
            main.innerHTML = renderProjectDetailView(proj);
            return;
          }
        }
        titleEl.textContent = 'المشاريع';
        main.innerHTML = renderProjectsListView(allowed);
      } else if (STATE.activeTab === 'accounts') {
        titleEl.textContent = 'الحسابات والمصروفات';
        main.innerHTML = renderAccountsAndExpensesView(allowed);
      } else if (STATE.activeTab === 'payments') {
        titleEl.textContent = 'دفعات العملاء';
        main.innerHTML = renderClientPaymentsView(allowed);
      } else if (STATE.activeTab === 'workers') {
        titleEl.textContent = 'العمال والصنايعية';
        main.innerHTML = renderWorkersView(allowed);
      } else if (STATE.activeTab === 'materials') {
        titleEl.textContent = 'الخامات والموردون';
        main.innerHTML = renderMaterialsView(allowed);
      } else if (STATE.activeTab === 'appointments') {
        titleEl.textContent = 'المواعيد والمهام';
        main.innerHTML = renderAppointmentsView(allowed);
      } else if (STATE.activeTab === 'team') {
        titleEl.textContent = 'إدارة الفريق والصلاحيات';
        main.innerHTML = renderTeamView();
      } else if (STATE.activeTab === 'tools') {
        titleEl.textContent = 'الأدوات السريعة والمفكرة';
        main.innerHTML = renderToolsView(allowed);
      }

    async function submitNewProject(e) {
      e.preventDefault();
      if (!sb) return;
      const btn = document.getElementById('np-save-btn');
      btn.disabled = true;
      btn.textContent = 'جاري الحفظ...';
      try {
        const officePct = Number(document.getElementById('np-office-pct').value) || 15;
        const basePayload = {
          name: document.getElementById('np-name').value.trim(),
          client_name: document.getElementById('np-client').value.trim(),
          client_phone: document.getElementById('np-phone').value.trim(),
          address: document.getElementById('np-address').value.trim(),
          contract_value: Number(document.getElementById('np-contract').value) || 0,
          start_date: document.getElementById('np-start').value,
          delivery_date: document.getElementById('np-delivery').value,
          status: document.getElementById('np-status').value,
          design_3d_cost: Number(document.getElementById('np-3d').value) || 0,
          execution_plans_cost: Number(document.getElementById('np-plans').value) || 0,
          notes: document.getElementById('np-notes').value.trim()
        };

        let { data: created, error } = await sb
          .from('projects')
          .insert({ ...basePayload, office_percentage: officePct })
          .select()
          .single();

        if (error && String(error.message || '').toLowerCase().includes('office_percentage')) {
          const fallbackRes = await sb.from('projects').insert(basePayload).select().single();
          created = fallbackRes.data;
          error = fallbackRes.error;
        }
        if (error) throw error;

        if (created?.id) {
          setLocalOfficePct(created.id, officePct);
          const { data: existing } = await sb.from('project_items').select('id').eq('project_id', created.id);
          if (!existing || existing.length === 0) {
            await sb.from('project_items').insert(
              DEFAULT_BOQ.map((title, idx) => ({
                project_id: created.id,
                title,
                sort_order: idx + 1,
                is_default_item: true
              }))
            );
          }
        }
        closeModal();
        await refreshAllData();
        showToast(`تم إنشاء المشروع (بنسبة مكتب ${officePct}%) وتوليد البنود الـ 9 بنجاح!`);
      } catch (err) {
        showToast(translateError(err, 'تعذر حفظ المشروع، تأكد من البيانات.'), 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'حفظ المشروع';
      }
    }

      document.getElementById('modal-root').innerHTML = '';
    }

    async function submitCostTx(e, projectId, itemId) {
      e.preventDefault();
      if (!sb) return;
      try {
        const { error } = await sb.from('item_cost_transactions').insert({
          project_id: projectId,
          item_id: itemId,
          cost_type: document.getElementById('tx-type').value,
          amount: Number(document.getElementById('tx-amount').value),
          transaction_date: document.getElementById('tx-date').value,
          description: document.getElementById('tx-desc').value.trim() || 'حركة تكلفة تراكمية'
        });
        if (error) throw error;
        closeModal();
        await refreshAllData();
        showToast('تمت إضافة التكلفة التراكمية وتحديث الإجمالي فوراً.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    async function updateItemProgress(itemId, val) {
      if (!sb) return;
      await sb.from('project_items').update({ completion_percentage: Math.min(100, Math.max(0, Number(val) || 0)) }).eq('id', itemId);
      await refreshAllData();
      showToast('تم تحديث نسبة إنجاز البند.');
    }

    async function addCustomItem(e, projectId) {
      e.preventDefault();
      const title = document.getElementById('custom-item-input').value.trim();
      if (!sb || !title) return;
      await sb.from('project_items').insert({
        project_id: projectId,
        title,
        sort_order: STATE.items.filter((i) => i.project_id === projectId).length + 1,
        is_default_item: false
      });
      await refreshAllData();
      showToast('تمت إضافة البند المخصص للمشروع.');
    }

    async function submitProjectExpense(e, projectId) {
      e.preventDefault();
      if (!sb) return;
      try {
        const { error } = await sb.from('general_expenses').insert({
          project_id: projectId,
          category: document.getElementById('pe-cat').value,
          amount: Number(document.getElementById('pe-amount').value),
          description: document.getElementById('pe-desc').value.trim(),
          expense_date: document.getElementById('pe-date').value,
          responsible_person: document.getElementById('pe-person').value.trim()
        });
        if (error) throw error;

        showToast('تم تسجيل المصروف العام للمشروع وتحديث الرصيد.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    async function submitProjectPayment(e, projectId) {
      e.preventDefault();
      if (!sb) return;
      try {
        const { error } = await sb.from('client_payments').insert({
          project_id: projectId,
          amount: Number(document.getElementById('pp-amount').value),
          payment_date: document.getElementById('pp-date').value,
          payment_method: document.getElementById('pp-method').value,
          receipt_number: document.getElementById('pp-receipt').value.trim() || null,
          allocated_item_id: document.getElementById('pp-item').value || null
        });
        if (error) throw error;
        await refreshAllData();
        showToast('تم تسجيل دفعة العميل وتحديث رصيد المشروع.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    async function submitDailyReport(e, projectId) {
      e.preventDefault();
      if (!sb) return;
      try {
        const dateVal = document.getElementById('dr-date').value;
        const photoFile = document.getElementById('dr-photo').files?.[0];
        const photos = [];
        if (photoFile) {
          const url = await uploadProjectFile(photoFile, projectId, `reports/${dateVal}`);
          if (url) {
            photos.push(url);
            await sb.from('project_files').insert({
              project_id: projectId,
              category: 'before_after',
              file_name: `${dateVal}_${photoFile.name}`,
              file_url: url,
              mime_type: photoFile.type || 'image/jpeg'
            });
          }
        }
        const { error } = await sb.from('daily_reports').insert({
          project_id: projectId,
          report_date: dateVal,
          workers_count: Number(document.getElementById('dr-workers').value) || 0,
          work_done: document.getElementById('dr-done').value.trim(),
          worked_items: document.getElementById('dr-items').value.split('،').map((s) => s.trim()).filter(Boolean),
          obstacles: document.getElementById('dr-obstacles').value.trim(),
          office_requests: document.getElementById('dr-req').value.trim(),
          photos
        });
        if (error) throw error;
        await refreshAllData();
        showToast('تم حفظ تقرير الموقع اليومي.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    async function initProjectChecklists(projectId) {
      if (!sb) return;
      await sb.from('quality_checklists').insert(
        CHECKLIST_TEMPLATES.map((t) => ({
          project_id: projectId,
          checklist_type: t.checklist_type,
          title: t.title,
          checklist_items: t.items,
          is_completed: false
        }))
      );
      await refreshAllData();
      showToast('تم إنشاء قوائم الاستلام والجودة.');
    }

    async function toggleChecklistItem(chkId, idx) {
      if (!sb) return;
      const chk = STATE.checklists.find((c) => c.id === chkId);
      if (!chk) return;
      const items = (chk.checklist_items || []).map((it, i) => (i === idx ? { ...it, done: !it.done } : it));
      const is_completed = items.length > 0 && items.every((i) => i.done);
      await sb.from('quality_checklists').update({ checklist_items: items, is_completed }).eq('id', chkId);
      await refreshAllData();
      showToast('تم تحديث بند الاستلام.');
    }

    async function submitProjectFile(e, projectId) {
      e.preventDefault();
      if (!sb) return;
      const file = document.getElementById('pf-file').files?.[0];
      if (!file) return;
      try {
        const cat = document.getElementById('pf-cat').value;
        const url = await uploadProjectFile(file, projectId, cat);
        await sb.from('project_files').insert({
          project_id: projectId,
          category: cat,
          file_name: document.getElementById('pf-name').value.trim() || file.name,
          file_url: url,
          mime_type: file.type || 'application/octet-stream'
        });
        await refreshAllData();
        showToast('تم رفع الملف لمكتبة المشروع.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    async function updateProjectOfficePercentage(projectId, pctValue) {
      const pct = Math.min(25, Math.max(10, Number(pctValue) || 15));
      setLocalOfficePct(projectId, pct);
      if (sb) {
        await sb.from('projects').update({ office_percentage: pct }).eq('id', projectId);
      }
      await refreshAllData();
      showToast(`تم تحديث نسبة المكتب لهذا المشروع إلى ${pct}%`);
    }

    async function submitOfficeWithdrawal(e, projectId) {
      e.preventDefault();
      const amount = Number(document.getElementById('ow-amount').value);
      const withdrawal_date = document.getElementById('ow-date').value;
      const withdrawn_by = document.getElementById('ow-person').value.trim() || 'مهندس عمر';
      const notes = document.getElementById('ow-notes').value.trim() || 'سحب من نسبة المكتب';
      if (!amount || amount <= 0) return;

      const row = {
        id: crypto.randomUUID(),
        project_id: projectId,
        withdrawn_by,
        amount,
        withdrawal_date,
        notes,
        created_at: new Date().toISOString()
      };

      saveLocalWithdrawal(row);
      if (sb) {
        const { error } = await sb.from('office_withdrawals').insert({
          project_id: projectId,
          withdrawn_by,
          amount,
          withdrawal_date,
          notes
        });
        if (error && String(error.message || '').toLowerCase().includes('withdrawn_by')) {
          await sb.from('office_withdrawals').insert({
            project_id: projectId,
            amount,
            withdrawal_date,
            notes: `[${withdrawn_by}] ${notes}`
          });
        }
      }
      closeModal();
      await refreshAllData();
      showToast(`تم تسجيل سحب (${formatEGP(amount)}) باسم ${withdrawn_by} وتحديث المتبقي للمكتب.`);
    }

    function getTaskRemindersMap() {
      try {
        return JSON.parse(localStorage.getItem(TASK_REMINDER_STORAGE_KEY) || '{}');
      } catch (_) {
        return {};
      }
    }

    function setTaskReminderOffset(taskId, minutes) {
      try {
        const map = getTaskRemindersMap();
        map[taskId] = Number(minutes);
        localStorage.setItem(TASK_REMINDER_STORAGE_KEY, JSON.stringify(map));
      } catch (_) {}
    }

    function playNotificationChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.46);
      } catch (_) {}
    }

    async function requestAppointmentNotifications() {
      if (!('Notification' in window)) {
        playNotificationChime();
        showToast('تنبيهات المواعيد مفعلة داخل التطبيق بنجاح.');
        return;
      }
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        playNotificationChime();
        new Notification('مكتب التشطيبات • تم تفعيل التنبيهات', {
          body: 'ستصلك إشعارات تلقائية عند اقتراب مواعيد المعاينات والاجتماعات وزيارات المواقع.'
        });
        showToast('تم تفعيل إشعارات المواعيد على جهازك بنجاح!');
        renderCurrentView();
      } else {
        showToast('يرجى السماح بالإشعارات من إعدادات المتصفح لتلقي التنبيهات.', 'error');
      }
    }

    function sendTaskNotificationNow(task) {
      const projName = STATE.projects.find((p) => p.id === task.project_id)?.name || 'عام';
      const timeStr = new Date(task.scheduled_at).toLocaleString('ar-EG', {
        weekday: 'short',
        hour: '2-digit',
        minute: '2-digit'
      });
      const typeLabel = TASK_TYPE_AR[task.entry_type] || 'موعد';
      const msg = `تذكير (${typeLabel}): ${task.title} — ${projName} (${timeStr})`;

      playNotificationChime();
      showToast(msg);

      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(`مكتب التشطيبات • تذكير ${typeLabel}`, {
          body: `${task.title}\nالمشروع: ${projName} • الموعد: ${timeStr}`
        });
      }
    }

    function checkUpcomingAppointmentNotifications() {
      if (!STATE.session || !STATE.tasks.length) return;
      const now = Date.now();
      const remindersMap = getTaskRemindersMap();
      let notifiedSet = {};
      try {
        notifiedSet = JSON.parse(sessionStorage.getItem(NOTIFIED_TASKS_SESSION_KEY) || '{}');
      } catch (_) {}

      STATE.tasks.forEach((t) => {
        if (t.status === 'completed' || notifiedSet[t.id]) return;
        const schedMs = new Date(t.scheduled_at).getTime();
        if (Number.isNaN(schedMs)) return;
        const offsetMin = remindersMap[t.id] !== undefined ? Number(remindersMap[t.id]) : 30;
        const triggerMs = schedMs - offsetMin * 60 * 1000;

        if (now >= triggerMs && now <= schedMs + 60 * 60 * 1000) {
          notifiedSet[t.id] = true;
          try {
            sessionStorage.setItem(NOTIFIED_TASKS_SESSION_KEY, JSON.stringify(notifiedSet));
          } catch (_) {}
          sendTaskNotificationNow(t);
        }
      });
    }

    setInterval(checkUpcomingAppointmentNotifications, 30000);

    async function submitNewTask(e) {
      e.preventDefault();
      if (!sb) return;
      const reminderMin = Number(document.getElementById('nt-reminder')?.value ?? 30);
      const { data: inserted, error } = await sb
        .from('appointments_tasks')
        .insert({
          title: document.getElementById('nt-title').value.trim(),
          entry_type: document.getElementById('nt-type').value,
          project_id: document.getElementById('nt-proj').value || null,
          scheduled_at: new Date(document.getElementById('nt-date').value).toISOString(),
          status: 'new'
        })
        .select()
        .single();

      if (error) {
        showToast(translateError(error), 'error');
        return;
      }

      if (inserted?.id) {
        setTaskReminderOffset(inserted.id, reminderMin);
      }

      if ('Notification' in window && Notification.permission === 'default') {
        await Notification.requestPermission();
      }

      closeModal();
      await refreshAllData();
      checkUpcomingAppointmentNotifications();
      showToast('تم حفظ الموعد وتفعيل الإشعار التلقائي بنجاح.');
    }

    async function submitNewEmployee(e) {
      e.preventDefault();
      if (!sb || !isMainAdmin()) return;
      const btn = document.getElementById('ne-submit-btn');
      btn.disabled = true;
      btn.textContent = 'جاري إنشاء الحساب...';

      try {
        const full_name = document.getElementById('ne-name').value.trim();
        const email = document.getElementById('ne-email').value.trim().toLowerCase();
        const password = document.getElementById('ne-pass').value;
        const role = document.getElementById('ne-role').value;
        const can_view_sensitive_finance = role === 'accountant' ? true : document.getElementById('ne-finance').checked;
        const assigned_project_ids = role === 'engineer'
          ? Array.from(document.querySelectorAll('input[name="ne-proj"]:checked')).map((el) => el.value)
          : [];

        const isolatedAuthClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
        });

        const { data: signUpData, error: signUpErr } = await isolatedAuthClient.auth.signUp({
          email,
          password,
          options: { data: { full_name, role } }
        });

        if (signUpErr) throw signUpErr;

        const newUserId = signUpData?.user?.id || crypto.randomUUID();

        const { error: profErr } = await sb.from('profiles').upsert(
          {
            id: newUserId,
            full_name,
            email,
            role,
            assigned_project_ids,
            can_view_sensitive_finance,
            is_active: true
          },
          { onConflict: 'email' }
        );

        if (profErr) throw profErr;

        closeModal();
        await refreshAllData();
        showToast(`تم إنشاء حساب (${full_name}) بنجاح ويمكنه الدخول الآن ببريده وكلمة المرور!`);
      } catch (err) {
        showToast(translateError(err, 'تعذر إنشاء حساب الموظف، تأكد من عدم تكرار البريد الإلكتروني.'), 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'إنشاء الحساب وتفعيل الصلاحيات';
      }
    }

              <option value="gypsum">جبس بورد</option>
            </select>
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-[#B5A99D] font-bold mb-1">المساحة (م²)</label>
                <input id="calc-area" type="number" value="100" oninput="runQuickCalc()" class="w-full px-3.5 py-2.5 rounded-2xl bg-[#14110E] border border-[#332B24] font-bold" />
              </div>
              <div>
                <label class="block text-[#B5A99D] font-bold mb-1">نسبة الهالك (%)</label>
                <input id="calc-waste" type="number" value="10" oninput="runQuickCalc()" class="w-full px-3.5 py-2.5 rounded-2xl bg-[#14110E] border border-[#332B24] font-bold" />
              </div>
            </div>
            <div id="calc-result" class="p-4 rounded-2xl bg-[#C6A984] text-[#14110E] font-black text-sm">110.0 م² خامات شاملة الهالك</div>
          </div>

          <div class="bg-[#1E1915] border border-[#2F2721] rounded-[28px] p-5 space-y-3 text-xs">
            <h4 class="font-extrabold text-sm text-[#C6A984]">المفكرة السريعة (Scratchpad)</h4>
            <form onsubmit="submitQuickNote(event)" class="flex gap-2">
              <input id="qn-text" type="text" required placeholder="سجّل فكرة أو مقاس أو رقم سريع..." class="flex-1 px-4 py-2.5 rounded-2xl bg-[#14110E] border border-[#332B24]" />
              <button type="submit" class="px-5 py-2.5 rounded-full bg-[#C6A984] text-[#14110E] font-extrabold cursor-pointer">حفظ</button>
            </form>
            <div class="space-y-2 max-h-60 overflow-y-auto">
              ${STATE.notes.map((n) => `
                <div class="p-3 rounded-2xl bg-[#14110E] flex justify-between items-center gap-2">
                  <span>${n.content}</span>
                  ${!n.converted_to_task ? `<button onclick="convertNoteToTask('${n.id}', '${n.content.replace(/'/g, '')}')" class="px-3 py-1 rounded-full bg-[#2B241E] text-[#C6A984] font-bold shrink-0 cursor-pointer">تحويل لمهمة</button>` : ''}
                </div>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function runQuickCalc() {
      const kind = document.getElementById('calc-kind')?.value;
      const area = Number(document.getElementById('calc-area')?.value) || 0;
      const waste = Number(document.getElementById('calc-waste')?.value) || 0;
      const total = area * (1 + waste / 100);
      let text = `${total.toFixed(1)} م² خامات شاملة الهالك`;
      if (kind === 'paint') text = `${Math.max(1, Math.ceil(total / 10))} بستلة دهان تقريباً`;
      if (kind === 'plaster') text = `${Math.max(1, Math.ceil(total * 0.22))} شيكارة أسمنت تقريباً`;
      if (kind === 'gypsum') text = `${Math.max(1, Math.ceil(total / 2.88))} لوح جبس بورد تقريباً`;
      const el = document.getElementById('calc-result');
      if (el) el.textContent = text;
    }

    async function submitQuickNote(e) {
      e.preventDefault();
      if (!sb || !STATE.session) return;
      await sb.from('quick_notes').insert({
        user_id: STATE.session.user.id,
        content: document.getElementById('qn-text').value.trim()
      });
      await refreshAllData();
      showToast('تم حفظ الملاحظة.');
    }

    async function convertNoteToTask(id, content) {
      if (!sb) return;
      await sb.from('appointments_tasks').insert({
        title: content,
        entry_type: 'task',
        scheduled_at: new Date().toISOString(),
        status: 'new'
      });
      await sb.from('quick_notes').update({ converted_to_task: true }).eq('id', id);
      await refreshAllData();
      showToast('تم تحويل الملاحظة إلى مهمة.');
    }

    // استعادة الجلسة تلقائياً عند فتح الصفحة بدون إظهار شاشة الدخول لثانية
    (async function bootApp() {
      const bootEl = document.getElementById('boot-screen');
      const loginEl = document.getElementById('login-screen');
      if (!sb) {
        bootEl?.classList.add('hidden');
        loginEl?.classList.remove('hidden');
        return;
      }
      try {
        const { data } = await sb.auth.getSession();
        if (data?.session) {
          STATE.session = data.session;
          await initAfterAuth();
          checkUpcomingAppointmentNotifications();
        } else {
          bootEl?.classList.add('hidden');
          loginEl?.classList.remove('hidden');
        }
      } catch (_) {
        bootEl?.classList.add('hidden');
        loginEl?.classList.remove('hidden');
      }
    })();
  </script>
</body>
</html>
