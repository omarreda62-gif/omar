      if (m.includes('invalid login')) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
      if (m.includes('email not confirmed')) return 'يرجى تأكيد البريد الإلكتروني أولاً.';
      if (m.includes('duplicate') || m.includes('unique')) return 'هذا السجل مسجل مسبقاً في النظام.';
      if (m.includes('permission') || m.includes('policy') || m.includes('row-level')) return 'ليس لديك صلاحية لتنفيذ هذا الإجراء.';
      return fallback;
    }

      const dockIds = ['home', 'operations', 'projects', 'accounts', 'materials'];
      const dockItems = items.filter((i) => dockIds.includes(i.id)).slice(0, 5);
      const dockEl = document.getElementById('mobile-floating-dock');
      if (dockEl) {
        dockEl.innerHTML = dockItems
          .map((it) => {
            const active = STATE.tab === it.id;
            return `
              <button onclick="switchTab('${it.id}')" aria-label="${it.label}"
                class="w-11 h-11 rounded-full flex items-center justify-center transition-all cursor-pointer ${
                  active ? 'bg-white text-[#111315] shadow-md scale-105' : 'text-slate-300 hover:text-white'
                }">
                ${NAV_ICONS[it.id] || ''}
              </button>`;
          })
          .join('');
      }
    }

    function computeFinancials(project) {
      const items = STATE.items.filter((i) => i.project_id === project.id);
      const totalItems = items.reduce((s, i) => {
        const t = i.total_cost != null ? Number(i.total_cost) : (Number(i.materials_cost) || 0) + (Number(i.labor_cost) || 0) + (Number(i.staging_cost) || 0);
        return s + t;
      }, 0);
      const avgCompletion = items.length ? Math.round(items.reduce((s, i) => s + (Number(i.completion_percentage) || 0), 0) / items.length) : 0;
      const totalPayments = STATE.payments.filter((p) => p.project_id === project.id).reduce((s, p) => s + (Number(p.amount) || 0), 0);
      const totalExpenses = STATE.expenses.filter((e) => e.project_id === project.id).reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const designCost = (Number(project.design_3d_cost) || 0) + (Number(project.execution_plans_cost) || 0);
      const outflow = totalItems + totalExpenses + designCost;
      const contract = Number(project.contract_value) || 0;
      const hasFixedContract = contract > 0;
      return {
        avgCompletion,
        totalItems,
        totalPayments,
        totalExpenses,
        designCost,
        outflow,
        contract,
        hasFixedContract,
        remainingOnClient: hasFixedContract ? Math.max(0, contract - totalPayments) : Math.max(0, outflow - totalPayments),
        availableBalance: totalPayments - outflow,
        netProfit: hasFixedContract ? contract - outflow : totalPayments - outflow
      };
    }

    // =========================================================================
    // 3. التنقل والقائمة الجانبية
    // =========================================================================
    function getNavItems() {
      const r = getRole();
      return [
        { id: 'home', label: 'الرئيسية', show: true },
        { id: 'operations', label: 'لوحة التشغيل', show: true },
        { id: 'projects', label: 'المشاريع', show: true },
        { id: 'workers', label: 'العمال والصنايعية', show: r !== 'accountant' },
        { id: 'accounts', label: 'حسابات المشروع', show: true },
        { id: 'payments', label: 'دفعات العميل', show: canViewFinance() },
        { id: 'appointments', label: 'المواعيد', show: true },
        { id: 'materials', label: 'الموردون والخامات', show: true },
        { id: 'team', label: 'إدارة الفريق', show: r === 'admin' },
        { id: 'settings', label: 'الإعدادات والأدوات', show: true }
      ].filter((x) => x.show);
    }

    function renderNavigation() {
      const items = getNavItems();
      const html = items
        .map(
          (it) => `
          <button onclick="switchTab('${it.id}')"
            class="w-full text-right px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all cursor-pointer ${
              STATE.tab === it.id ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
            }">
            ${it.label}
          </button>`
        )
        .join('');
      document.getElementById('desktop-nav').innerHTML = html;
      document.getElementById('mobile-nav').innerHTML = html;
    }

    function toggleMobileMenu(open) {
      const el = document.getElementById('mobile-drawer');
      if (open) el.classList.remove('hidden');
      else el.classList.add('hidden');
    }

    function switchTab(tabId) {
      STATE.tab = tabId;
      if (tabId !== 'projects') STATE.selectedProjectId = null;
      toggleMobileMenu(false);
      renderNavigation();
      renderMainView();
    }

    function openProject(projectId) {
      STATE.tab = 'projects';
      STATE.selectedProjectId = projectId;
      renderNavigation();
      renderMainView();
    }

    // =========================================================================
    // 4. عرض الصفحات (الرئيسية، التشغيل، المشاريع، الحسابات، الدفعات، إلخ)
    // =========================================================================
    function renderMainView() {
      const navItem = getNavItems().find((n) => n.id === STATE.tab);
      const selectedProj = STATE.projects.find((p) => p.id === STATE.selectedProjectId);
      document.getElementById('header-title').textContent = selectedProj ? selectedProj.name : navItem?.label || 'مكتب التشطيبات';

      const container = document.getElementById('main-content');
      if (STATE.tab === 'home') container.innerHTML = renderHomeView();
      else if (STATE.tab === 'operations') container.innerHTML = renderOperationsView();
      else if (STATE.tab === 'projects' && !selectedProj) container.innerHTML = renderProjectsListView();
      else if (STATE.tab === 'projects' && selectedProj) container.innerHTML = renderProjectDetailView(selectedProj);
      else if (STATE.tab === 'workers') container.innerHTML = renderWorkersView();
      else if (STATE.tab === 'accounts') container.innerHTML = renderAccountsView();
      else if (STATE.tab === 'payments') container.innerHTML = renderPaymentsView();
      else if (STATE.tab === 'appointments') container.innerHTML = renderAppointmentsView();
      else if (STATE.tab === 'materials') container.innerHTML = renderMaterialsView();
      else if (STATE.tab === 'team') container.innerHTML = renderTeamView();
      else if (STATE.tab === 'settings') container.innerHTML = renderSettingsView();
    }

      return `
        <div class="space-y-6">

          <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 pt-1">

              <h3 class="text-2xl sm:text-3xl font-extrabold text-[#111315] leading-tight">

            </div>
            ${
              getRole() !== 'accountant'
                ? `<button onclick="openNewProjectModal()" class="px-6 py-3.5 rounded-full bg-[#111315] hover:bg-neutral-800 text-white font-extrabold text-xs shadow-md cursor-pointer self-start sm:self-auto">

            <input id="tx-desc" placeholder="البيان / ملاحظات" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300" />

    async function submitCostTx(e, projectId, itemId) {
      e.preventDefault();
      try {
        const { error } = await sb.from('item_cost_transactions').insert({
          project_id: projectId,
          item_id: itemId,
          cost_type: document.getElementById('tx-type').value,
          amount: Number(document.getElementById('tx-amount').value),
          transaction_date: document.getElementById('tx-date').value,
          description: document.getElementById('tx-desc').value.trim() || 'حركة تكلفة تراكمية',
          created_by: STATE.session?.user?.id || null
        });
        if (error) throw error;
        closeModal();
        await refreshAllData();
        showToast('تمت إضافة حركة التكلفة التراكمية وتحديث إجمالي البند فوراً.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    async function updateItemCompletion(itemId, val) {
      try {
        const { error } = await sb
          .from('project_items')
          .update({ completion_percentage: Math.min(100, Math.max(0, Number(val) || 0)) })
          .eq('id', itemId);
        if (error) throw error;
        await refreshAllData();
        showToast('تم تحديث نسبة إنجاز البند.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    async function addCustomProjectItem(e, projectId) {
      e.preventDefault();
      const title = document.getElementById('custom-item-input').value.trim();
      if (!title) return;
      try {
        const { error } = await sb.from('project_items').insert({
          project_id: projectId,
          title,
          sort_order: STATE.items.filter((i) => i.project_id === projectId).length + 1,
          is_default_item: false
        });
        if (error) throw error;
        await refreshAllData();
        showToast('تمت إضافة البند المخصص.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    async function submitDailyReport(e, projectId) {
      e.preventDefault();
      try {
        const file = document.getElementById('rep-photo').files?.[0];
        const photos = [];
        if (file) {
          const path = `${projectId}/reports/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
          const { error: upErr } = await sb.storage.from('project-files').upload(path, file);
          if (!upErr) {
            const { data: pub } = sb.storage.from('project-files').getPublicUrl(path);
            if (pub?.publicUrl) photos.push(pub.publicUrl);
          }
        }
        const { error } = await sb.from('daily_reports').insert({
          project_id: projectId,
          report_date: document.getElementById('rep-date').value,
          workers_count: Number(document.getElementById('rep-workers').value) || 0,
          work_done: document.getElementById('rep-work').value.trim(),
          obstacles: document.getElementById('rep-obs').value.trim(),
          office_requests: document.getElementById('rep-req').value.trim(),
          photos,
          created_by: STATE.session?.user?.id || null
        });
        if (error) throw error;
        await refreshAllData();
        showToast('تم حفظ تقرير الموقع اليومي.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    async function uploadProjectFile(e, projectId) {
      e.preventDefault();
      const file = document.getElementById('pf-file').files?.[0];
      if (!file) return;
      try {
        const cat = document.getElementById('pf-cat').value;
        const path = `${projectId}/${cat}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
        const { error: upErr } = await sb.storage.from('project-files').upload(path, file);
        if (upErr) throw upErr;
        const { data: pub } = sb.storage.from('project-files').getPublicUrl(path);
        const { error } = await sb.from('project_files').insert({
          project_id: projectId,
          category: cat,
          file_name: file.name,
          file_url: pub?.publicUrl || path,
          uploaded_by: STATE.session?.user?.id || null
        });
        if (error) throw error;
        await refreshAllData();
        showToast('تم رفع الملف بنجاح.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    async function submitNewWorker(e) {

    function updateCalc() {
      const k = document.getElementById('calc-kind')?.value || 'ceramic';
      const area = Number(document.getElementById('calc-area')?.value) || 0;
      const waste = Number(document.getElementById('calc-waste')?.value) || 0;
      const base = area * (1 + waste / 100);
      let txt = `${base.toFixed(1)} م² خامات (شاملة الهالك ${waste}%)`;
      if (k === 'paint') txt = `${Math.max(1, Math.ceil(base / 10))} بستلة دهان تقريباً`;
      if (k === 'plaster') txt = `${Math.max(1, Math.ceil(base * 0.22))} شيكارة أسمنت تقريباً`;
      if (k === 'gypsum') txt = `${Math.max(1, Math.ceil(base / 2.88))} لوح جبس بورد تقريباً`;
      const el = document.getElementById('calc-res');
      if (el) el.textContent = txt;
    }

    async function submitQuickNote(e) {
      e.preventDefault();
      const content = document.getElementById('qn-text').value.trim();
      if (!content) return;
      try {
        const { error } = await sb.from('quick_notes').insert({
          user_id: STATE.session?.user?.id,
          content
        });
        if (error) throw error;
        await refreshAllData();
        showToast('تم حفظ الملاحظة.');
      } catch (err) {
        showToast(translateError(err), 'error');
      }
    }

    // فحص الجلسة الحالية عند فتح الصفحة
    window.addEventListener('DOMContentLoaded', async () => {
      if (!sb) return;
      try {
        const { data } = await sb.auth.getSession();
        if (data?.session) {
          STATE.session = data.session;
          await initAfterAuth();
        }
      } catch (_) {}
    });
  </script>
</body>
</html>
